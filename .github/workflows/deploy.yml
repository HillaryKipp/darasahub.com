name: Deploy to HostAfrica (DirectAdmin)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy via FTPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, gd, curl, sodium
          coverage: none

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install NPM dependencies & build Vite assets
        run: |
          npm ci
          npm run build

      - name: Sync Laravel application to app/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./
          server-dir: ${{ vars.FTP_APP_DIR || '/domains/darasahub.com/app/' }}
          state-name: .ftp-deploy-sync-state-app.json
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .env
            .env.*
            node_modules/**
            tests/**
            storage/**
            bootstrap/cache/*.php
            public/**
            .phpunit.result.cache

      - name: Sync public assets to public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./public/
          server-dir: ${{ vars.FTP_PUBLIC_DIR || '/domains/darasahub.com/public_html/' }}
          state-name: .ftp-deploy-sync-state-public.json
          exclude: |
            index.php
            sitemap.xml
            sitemaps/**
            storage/**

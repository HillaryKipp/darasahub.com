name: Deploy to HostAfrica (DirectAdmin)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sync_vendor:
        description: 'Also sync vendor/ directory via parallel FTPS (only needed when composer.lock changes)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy via FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies & build Vite assets
        run: |
          npm ci
          npm run build

      - name: Sync Laravel application to app/ (excluding vendor/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./
          server-dir: ${{ vars.FTP_APP_DIR || '/domains/darasahub.com/app/' }}
          state-name: .ftp-deploy-sync-state-app.json
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .env
            .env.*
            vendor/**
            node_modules/**
            tests/**
            docs/**
            storage/**
            bootstrap/cache/*.php
            public/**
            .phpunit.result.cache

      - name: Sync public assets to public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./public/
          server-dir: ${{ vars.FTP_PUBLIC_DIR || '/domains/darasahub.com/public_html/' }}
          state-name: .ftp-deploy-sync-state-public.json
          exclude: |
            index.php
            sitemap.xml
            sitemaps/**
            storage/**

      - name: Setup PHP 8.4 (only when syncing vendor/)
        if: ${{ inputs.sync_vendor == true }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, gd, curl, sodium
          coverage: none

      - name: Install Composer dependencies (only when syncing vendor/)
        if: ${{ inputs.sync_vendor == true }}
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Sync vendor/ via parallel FTPS (lftp)
        if: ${{ inputs.sync_vendor == true }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_APP_DIR: ${{ vars.FTP_APP_DIR || '/domains/darasahub.com/app/' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          APP_DIR="${FTP_APP_DIR%/}/"
          LFTP_PASSWORD="$FTP_PASSWORD" lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          mirror --reverse --delete --only-newer --parallel=5 \
            --exclude-glob "*.md" \
            --exclude-glob "*/docs/*" \
            --exclude-glob "*/tests/*" \
            ./vendor "${APP_DIR}vendor"
          bye
          EOF
